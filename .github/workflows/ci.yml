name: Spring Boot CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Tests with JaCoCo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ms-vehiculos

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven
          cache-dependency-path: ms-vehiculos/pom.xml

      - name: Build and test
        run: mvn clean verify

      - name: Upload JaCoCo Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: ms-vehiculos/target/site/jacoco/

  build:
    name: Build Jar
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: ms-vehiculos

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven
          cache-dependency-path: ms-vehiculos/pom.xml

      - name: Package application
        run: mvn clean package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: ms-vehiculos/target/*.jar
